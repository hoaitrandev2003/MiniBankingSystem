<!doctype html>
<html class="no-js" lang="en">
	
<head>
		<meta charset="utf-8">
		<meta http-equiv="x-ua-compatible" content="ie=edge">
		<title>OTP Verification | Bultifore</title>
		<meta name="description" content="">
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<!-- favicon -->		
		<link rel="shortcut icon" type="image/x-icon" href="img/logo/favicon.ico">

		<!-- all css here -->
		<link rel="stylesheet" href="css/bootstrap.min.css">
		<link rel="stylesheet" href="css/themify-icons.css">
		<link rel="stylesheet" href="style.css">
		<link rel="stylesheet" href="css/responsive.css">

		<!-- modernizr css -->
		<script src="js/vendor/modernizr-2.8.3.min.js"></script>

		<style>
			.otp-form {
				max-width: 520px;
				margin: 0 auto;
			}
			.otp-icon {
				width: 74px;
				height: 74px;
				margin: 0 auto 18px;
				border-radius: 50%;
				display: flex;
				align-items: center;
				justify-content: center;
				background: rgba(27, 168, 198, 0.12);
				border: 1px solid rgba(27, 168, 198, 0.35);
				color: #fff;
				font-size: 28px;
			}
			.otp-subtitle {
				text-align: center;
				color: rgba(255,255,255,0.78);
				font-size: 14px;
				line-height: 1.8;
				margin: 0 0 15px;
			}
			.otp-email {
				text-align: center;
				font-size: 14px;
				font-weight: 700;
				color: #ffffff;
				margin-bottom: 22px;
				letter-spacing: 0.04em;
			}
			.otp-inputs {
				display: flex;
				justify-content: center;
				gap: 12px;
				margin: 20px 0 28px;
			}
			.otp-input {
				width: 52px;
				height: 60px;
				border: 1px solid rgba(255,255,255,0.18);
				border-radius: 12px;
				background: rgba(255,255,255,0.04);
				color: #fff;
				font-size: 26px;
				font-weight: 700;
				text-align: center;
				outline: none;
				transition: all 0.3s ease;
			}
			.otp-input:focus {
				border-color: rgba(27, 168, 198, 0.9);
				box-shadow: 0 0 0 4px rgba(27, 168, 198, 0.12);
				background: rgba(255,255,255,0.06);
			}
			.otp-actions {
				text-align: center;
				margin-bottom: 18px;
			}
			.otp-meta {
				text-align: center;
				color: rgba(255,255,255,0.75);
				font-size: 13px;
				margin-top: 18px;
			}
			.otp-meta a {
				color: #1ba8c6;
				font-weight: 600;
			}
			.otp-meta a:hover {
				color: #6dd5ee;
			}
			@media (max-width: 767px) {
				.otp-inputs {
					gap: 8px;
				}
				.otp-input {
					width: 42px;
					height: 52px;
					font-size: 22px;
				}
			}
		</style>
	</head>
	<body data-spy="scroll" data-target="#navbar-example">

		<!--[if lt IE 8]>
			<p class="browserupgrade">You are using an <strong>outdated</strong> browser. Please <a href="http://browsehappy.com/">upgrade your browser</a> to improve your experience.</p>
		<![endif]-->

		<div class="login-area area-padding fix">
			<div class="login-overlay"></div>
			<div class="table">
				<div class="table-cell">
					<div class="container">
						<div class="row">
							<div class="col-md-offset-3 col-md-6 col-sm-offset-2 col-sm-8 col-xs-12">
								<div class="login-form otp-form">
									<div class="otp-icon"><i class="ti-lock"></i></div>
									<h4 class="login-title text-center">OTP VERIFICATION</h4>
									<p class="otp-subtitle">We have sent a 6-digit verification code to your email or phone. Enter the code below to continue.</p>
									<div class="otp-email">mickel.jhon@example.com</div>

									<form id="otpForm" method="POST" class="log-form">
										<div class="otp-inputs">
											<input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 1">
											<input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 2">
											<input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 3">
											<input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 4">
											<input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 5">
											<input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 6">
										</div>

										<div class="col-md-12 col-sm-12 col-xs-12 text-center otp-actions">
											<button type="submit" id="submit" class="slide-btn login-btn">Verify OTP</button>
										</div>

										<div class="col-md-12 col-sm-12 col-xs-12 text-center">
											<div class="otp-meta">
												<span>Didn't receive the code?</span>
												<a href="#">Resend code</a>
											</div>
										</div>

										<div class="col-md-12 col-sm-12 col-xs-12 text-center">
											<div class="acc-not"><a href="login.html">Back to Login</a></div>
										</div>
									</form>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- all js here -->
		<script src="js/vendor/jquery-1.12.4.min.js"></script>
		<script src="js/bootstrap.min.js"></script>
		<script src="js/form-validator.min.js"></script>
		<script src="js/plugins.js"></script>
		<script src="js/auth.js"></script>

		<script>
			document.addEventListener('DOMContentLoaded', function () {
				const otpInputs = Array.from(document.querySelectorAll('.otp-input'));

				otpInputs.forEach(function (input, index) {
					input.addEventListener('input', function () {
						this.value = this.value.replace(/[^0-9]/g, '').slice(0, 1);
						if (this.value && index < otpInputs.length - 1) {
							otpInputs[index + 1].focus();
						}
					});

					input.addEventListener('keydown', function (event) {
						if (event.key === 'Backspace' && !this.value && index > 0) {
							otpInputs[index - 1].focus();
						}
						if (event.key === 'ArrowLeft' && index > 0) {
							otpInputs[index - 1].focus();
						}
						if (event.key === 'ArrowRight' && index < otpInputs.length - 1) {
							otpInputs[index + 1].focus();
						}
					});
				});

				document.getElementById('otpForm').addEventListener('submit', function (event) {
					event.preventDefault();
					const code = otpInputs.map(function (input) { return input.value; }).join('');
					if (code.length < 6) {
						alert('Please enter the full 6-digit OTP code.');
						return;
					}
					alert('OTP verified successfully!');
				});
			});
		</script>
	</body>
</html>
