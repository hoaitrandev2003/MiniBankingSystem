        <div class="login-area area-padding fix">
            <div class="login-overlay"></div>
            <div class="table">

                        <div class="row">
                            <div class="col-md-offset-3 col-md-6 col-sm-offset-2 col-sm-8 col-xs-12">
                                <div class="login-form signup-form">
                                    <h4 class="login-title text-center">CREATE ACCOUNT</h4>
                                    <div class="row">
                                        <form id="verifyPasswordForm" method="POST" class="log-form">
                                            <div class="col-md-12 col-sm-12 col-xs-12">
                                                <input type="email" id="email" class="form-control" placeholder="Your Email" required data-error="Please enter your email">
                                            </div>
                                            <div class="col-md-12 col-sm-12 col-xs-12">
                                                <input type="text" id="username" class="form-control" placeholder="Your Username" required data-error="Please enter your username">
                                            </div>
                                            <div class="col-md-12 col-sm-12 col-xs-12">
                                                <input type="password" id="currentPassword" class="form-control" placeholder="Current Password" required data-error="Please enter your current password">
                                            </div>
                                            <div class="col-md-12 col-sm-12 col-xs-12">
                                                <input type="password" id="newPassword" class="form-control" placeholder="New Password" required data-error="Please enter new password">
                                                <small class="form-text text-muted">Password must be at least 8 characters</small>
                                            </div>
                                            <div class="col-md-12 col-sm-12 col-xs-12">
                                                <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm New Password" required data-error="Please confirm your password">
                                            </div>
                                            <div class="col-md-12 col-sm-12 col-xs-12 text-center">
                                                <div class="check-group flexbox">

                                                </div>
                                            </div>
                                            <div class="col-md-12 col-sm-12 col-xs-12 text-center">
